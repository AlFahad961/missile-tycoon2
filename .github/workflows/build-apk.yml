name: Build Android APK

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: godot --headless --verbose --import || true

      - name: Export APK
        run: |
          mkdir -v -p build
          godot --headless --verbose --export-debug "Android Debug" "$(pwd)/build/MissileTycoon.apk"
          ls -l build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MissileTycoon-apk
          path: build/MissileTycoon.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: build/MissileTycoon.apk
