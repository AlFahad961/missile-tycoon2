name: Build Android APK

on:
  push:
  workflow_dispatch:

env:
  GODOT_VERSION: 4.3

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mkdir -v -p ~/.config/
          mv /root/.config/godot ~/.config/godot
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable

      - name: Import project
        run: godot --headless --verbose --import || true

      - name: Smoke test - does the game start
        run: |
          timeout 120 godot --headless --quit-after 120 > run1.log 2>&1 || true
          tail -40 run1.log
          if grep -qE "SCRIPT ERROR|Parse Error|Compile Error|Failed to load script" run1.log; then
            echo "::error title=Game script has errors::$(grep -E 'SCRIPT ERROR|Parse Error|Compile Error|Failed to load script' -A1 run1.log | head -8 | tr '\n' ' ')"
            exit 1
          fi

      - name: Self test - plays the game automatically
        continue-on-error: true
        run: |
          timeout 400 godot --headless --quit-after 100000 -- --selftest > run2.log 2>&1 || true
          tail -60 run2.log
          if grep -qE "SCRIPT ERROR|Parse Error" run2.log; then
            echo "::warning title=Selftest found errors::$(grep -E 'SCRIPT ERROR|Parse Error' -A1 run2.log | head -10 | tr '\n' ' ')"
          fi
          if ! grep -q "SELFTEST done" run2.log; then
            echo "::warning title=Selftest did not finish::$(tail -6 run2.log | tr '\n' ' ')"
          fi

      - name: Export APK
        run: |
          mkdir -v -p build
          godot --headless --verbose --export-debug "Android Debug" "$(pwd)/build/MissileTycoon.apk"
          ls -l build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MissileTycoon-apk
          path: build/MissileTycoon.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: APK build ${{ github.run_number }}
          files: build/MissileTycoon.apk
